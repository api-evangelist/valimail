aid: valimail
name: Valimail
description: >-
  Valimail is an email authentication platform that automates DMARC enforcement
  to stop phishing, spoofing, and brand impersonation. Its Monitor, Enforce,
  Amplify, and Align products give organizations visibility into every service
  sending on their domains and manage SPF, DKIM, DMARC, BIMI, MTA-STS, and
  TLS-RPT at scale. Valimail publishes REST APIs — a DMARC Configuration API,
  a partner Account Management API, and a Reporting Data API — secured with
  bearer tokens, plus SCIM 2.0 user provisioning and Ed25519-signed webhooks.
  The platform is FedRAMP LI-SaaS authorized and SOC 2 Type II certified.
