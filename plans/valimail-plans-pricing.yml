notes: >-
  Valimail publishes a public pricing page with a named tier ladder, but only
  the free Monitor tier and the Enforce Starter entry price carry a number;
  Premium, Enterprise and Amplify are quoted by sales. API access is NOT part
  of the base plan on the lower tiers: it is a paid add-on on Enforce Premium
  and is only included outright ("Full API access") on Enforce Enterprise —
  which is the practical gate on this provider's API surface. Recorded verbatim
  from the pricing page; no quota numbers beyond user/SPF-lookup caps are
  published.
