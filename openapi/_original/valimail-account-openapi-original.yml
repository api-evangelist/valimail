security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    KeyRequest:
      type: object
      properties:
        client-id:
          type: string
        app-id:
          type: string
    KeyResponse:
      type: object
      properties:
        token:
          type: string
        expires-at:
          type: string
    ErrorResponse:
      type: object
      properties:
        request:
          type: string
        message:
          type: string
        type:
          type: string
        request-id:
          type: string
        call:
          type: string

    PortfolioSets:
      type: array
      items:
        properties:
          portfolio-name:
            type: string
          account-name:
            type: string
          domain-name:
            type: string
          org-domain-name:
            type: string
      example:
        - portfolio-name: "Valimail"
          account-name: "Valimail"
          domain-name: "dmarceverywhere.com"
          org-domain-name: "dmarceverywhere.com"
        - portfolio-name: "Valimail"
          account-name: "Valimail"
          domain-name: "heytest.com"
          org-domain-name: "heytest.com"

    User:
      type: object
      properties:
        email:
          type: string
        first-name:
          type: string
        last-name:
          type: string
        slug:
          type: string
        account-slug:
          type: string
        last-active-at:
          type: string
          format: date-time
        invitation-accepted-at:
          type: string
          format: date-time
          description: Present when the invitation has already been accepted.
        user-type:
          type: string
          enum:
            - "member"
            - "owner"
            - "marketer"
      example:
        email: "test@234.com"
        first-name: "John"
        last-name: "Doe"
        slug: "john-doe"
        account-slug: "valimail"
        last-active-at: "2026-02-24T12:30:00Z"
        invitation-accepted-at: "2026-04-07T09:15:00Z"
        user-type: "owner"

    InvitedUser:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        properties:
          activation-link:
            type: string
            description: Invitation activation URL. Returned as an empty string when
              the invitation has already been accepted and invitation-accepted-at
              is present in the response.
      example:
        email: test@234.com
        first-name: John
        last-name: Doe
        slug: john-doe
        account-slug: valimail
        last-active-at: '2026-02-24T12:30:00Z'
        user-type: owner
        activation-link: 'https://app.valimail.com/users/invitation/accept?invitation_token=example-token'

    CreateUser:
      type: object
      properties:
        email:
          description: "Email of the user."
          type: string
        first-name:
          description: "First name of the user."
          type: string
        last-name:
          description: "Last name of the user."
          type: string
        user-type:
          description: 'Optional: User type in the account. Defaults to owner. Marketer
            is only valid when the account supports that role.'
          type: string
          enum:
            - "member"
            - "owner"
            - "marketer"

    UserUpdate:
      type: object
      properties:
        email:
          type: string
        first-name:
          type: string
        last-name:
          type: string
        user-type:
          type: string
          enum:
            - "member"
            - "owner"
            - "marketer"

    UserDelete:
      type: object
      properties:
        slug:
          type: string
        account-slug:
          type: string

    SsoCreate:
      type: object
      properties:
        cert:
          type: string
          description: SAML certificate (manual mode).
        idp-entity-id:
          type: string
          description: Identity provider entity ID (manual mode).
        saml-endpoint:
          type: string
          description: SAML endpoint URL (manual mode).
        idp-metadata-file:
          type: string
          description: IdP metadata file content (metadata mode; mutually exclusive with manual fields).
        jit-provisioning-enabled:
          type: boolean
          description: Enable just-in-time user provisioning.
        provisioning-domains:
          type: array
          items:
            type: string
          description: List of domains used for JIT provisioning.
    SsoConfig:
      type: object
      properties:
        account-slug:
          type: string
        cert:
          type: string
        idp-entity-id:
          type: string
        saml-endpoint:
          type: string
        jit-provisioning-enabled:
          type: boolean
        provisioning-domains:
          type: array
          items:
            type: string
        created-at:
          type: string
          format: date-time
        updated-at:
          type: string
          format: date-time

    Domain:
      $ref: './config.yml#/components/schemas/Domain'
    DomainUpdate:
      $ref: './config.yml#/components/schemas/DomainUpdate'
    DomainCreate:
      $ref: './config.yml#/components/schemas/DomainCreate'


    AccountListItem:
      type: object
      description: "Account read response payload. Fields with empty or null values are omitted. Numeric limit fields are serialized as strings."
      properties:
        name:
          type: string
          description: "Required: Name of the account."
        org-domain-name:
          type: array
          items:
            type: string
          description: "Optional: List of domains associated with the account."
        parent-slug:
          type: string
          description: "Optional: Partner account slug of the child account"
        slug:
          type: string
          description: "Optional: Account identifier."
        enabled-org-domains-limit:
          type: string
          description: "Optional: Limit of enabled domains, serialized as a string in responses."
        blocked-org-domains-limit:
          type: string
          description: "Optional: Limit of blocked domains, serialized as a string in responses."
        sending-sub-domains-limit:
          type: string
          description: "Optional: Limit of domains with sender services, serialized as a string in responses."
        approved-senders-limit:
          type: string
          description: "Optional: Limit of approved senders, serialized as a string in responses."


    Account:
      type: object
      description: "Account response payload. Fields with empty or null values are omitted. Numeric limit fields are serialized as strings."
      properties:
        name:
          type: string
          description: "Required: Name of the account."
        org-domain-name:
          type: array
          items:
            type: string
          description: "Optional: List of domains associated with the account."
        parent-slug:
          type: string
          description: "Optional: Partner account slug of the child account"
        slug:
          type: string
          description: "Optional: Account identifier."
        enabled-org-domains-limit:
          type: string
          description: "Optional: Limit of enabled domains, serialized as a string in responses."
        blocked-org-domains-limit:
          type: string
          description: "Optional: Limit of blocked domains, serialized as a string in responses."
        sending-sub-domains-limit:
          type: string
          description: "Optional: Limit of domains with sender services, serialized as a string in responses."
        approved-senders-limit:
          type: string
          description: "Optional: Limit of approved senders, serialized as a string in responses."
        package-slug:
          type: string
          description: "Optional: Slug of the package assigned to the account."


    UpdateAccount:
      type: object
      properties:
        name:
          type: string
          description: "Name of the account. Empty strings are treated as not provided."
        enabled-org-domains-limit:
          type: integer
          description: "Limit of enabled domains. A value of 0 is treated as not provided."
        blocked-org-domains-limit:
          type: integer
          description: "Limit of blocked domains. A value of 0 is treated as not provided."
        sending-sub-domains-limit:
          type: integer
          description: "Limit of domains with sender services. A value of 0 is treated as not provided."
        approved-senders-limit:
          type: integer
          description: "Limit of approved senders. A value of 0 is treated as not provided. A value of -1 clears the stored limit and reads back as -1."
        package-slug:
          type: string
          description: "Package slug to assign to the account. When omitted, the existing package remains unchanged."

    Senders:
      type: array
      items:
        type: object
        properties:
          service_name:
            type: string
            description: "Name of the service"
            example: "SendGrid"
          service_status:
            type: string
            description: "Current status of the service"
            example: "active"
          total_messages_count:
            type: integer
            description: "Total number of messages"
            example: 1500
          passing_percentage:
            type: number
            format: float
            description: "Percentage of passing messages"
            example: 95.5
          dmarc_passing_count:
            type: integer
            description: "Number of messages passing DMARC"
            example: 1400
          dmarc_failing_count:
            type: integer
            description: "Number of messages failing DMARC"
            example: 100
          allowed_through_no_enforcement_count:
            type: integer
            description: "Messages allowed through without enforcement"
            example: 50
          allowed_through_with_enforcement_count:
            type: integer
            description: "Messages allowed through with enforcement"
            example: 20
          aligned_spf_count:
            type: integer
            description: "Number of SPF aligned messages"
            example: 1300
          failing_or_unaligned_spf_count:
            type: integer
            description: "Number of messages failing or unaligned with SPF"
            example: 200
          dmarc_overridden_count:
            type: integer
            description: "Number of DMARC overridden messages"
            example: 30
          quarantined_count:
            type: integer
            description: "Number of messages quarantined"
            example: 10
          rejected_count:
            type: integer
            description: "Number of messages rejected"
            example: 5



    Any: {}
    ValidationDetail:
      type: object
      properties:
        field:
          type: string
