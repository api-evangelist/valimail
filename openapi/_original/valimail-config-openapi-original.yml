security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    KeyRequest:
      type: object
      properties:
        client-id:
          type: string
        app-id:
          type: string
    KeyResponse:
      type: object
      properties:
        token:
          type: string
        expires-at:
          type: string
    WebhookPublicKeys:
      type: object
      description: Map of key IDs to base64-encoded Ed25519 public keys.
      additionalProperties:
        type: string
    Account:
      type: object
      properties:
        name:
          type: string
          description: The name of the account.
        org-domain-name:
          type: array
          items:
            type: string
          description: The list of org domains associated with the account.
        parent-slug:
          type: string
          description: The slug of the partner account.
        slug:
          type: string
          description: The unique identifier of the account.
        enabled-org-domains-limit:
          type: integer
          description: The limit of enabled org domains.
        blocked-org-domains-limit:
          type: integer
          description: The limit of blocked org domains.
        sending-sub-domains-limit:
          type: integer
          description: The limit of sending sub domains.
    Domain:
      type: object
      properties:
        domain:
          type: string
          description: The domain name.
        is-org-domain:
          type: boolean
          description: Whether the domain is an organizational domain.
        dmarc-record:
          type: string
          description: The DMARC record for the domain.
        enforcement-status:
          type: string
          description: The enforcement status of the domain.
        dmarc-policy:
          type: string
          description: The DMARC policy of the domain.
        sending-status:
          type: string
          description: The sending status of the domain.
        account-slug:
          type: string
          description: The unique identifier of the account associated with the domain.
        last-report-date:
          type: string
          description: The date of the last DMARC report.
        dmarc-pcd:
          type: string
          description: The dmarc policy compliance.
    DomainUpdate:
      type: object
      properties:
        dmarc-policy:
          type: string
        sending-status:
          type: string
    DomainCreate:
      type: object
      properties:
        domain:
          type: string

    User:
      type: object
      properties:
        email:
          type: string
        first-name:
          type: string
        last-name:
          type: string
        slug:
          type: string
        account-slug:
          type: string

    Sender:
      type: object
      properties:
        slug:
          type: string
          description: The unique identifier of the sender.
        name:
          type: string
          description: The name of the sender.
        status:
          type: string
          description: The status of the sender (e.g., approved, denied or pending_approval).
        domainSlug:
          type: string
          description: The unique identifier of the domain associated with the sender.
        accountSlug:
          type: string
          description: The unique identifier of the account associated with the sender.
        reverse:
          type: boolean
          description: A boolean value indicating if the results should be returned in reverse order.
        sortKey:
          type: string
          description: The key to sort the results (e.g., name, status, etc.).
      example:
        slug: "sendgrid"
        name: "SendGrid"
        status: "pending_approval"
        domainSlug: "dmarceverywhere.com"
        accountSlug: "valimail"

    Dkim:
      type: object
      properties:
        selector:
          type: string
          description: Selector for the DKIM record
        comment:
          type: string
          description: Optional comment for the DKIM record
        public-key:
          type: string
          description: Public key for the DKIM record
        cname-target:
          type: string
          description: CNAME target for the DKIM record
        sender-slug:
          type: string
          description: Slug of the sender associated with the DKIM record
        domain-slug:
          type: string
          description: Slug of the domain associated with the DKIM record
        sender-owner:
          type: string
          description: Owner of the sender
        domain-owner:
          type: string
          description: Owner of the domain
        reverse:
          type: boolean
          description: Indicates if the sorting should be reversed
      example:
        selector: "selector1"
        comment: "This is a comment"
        public-key: "public-key-here"
        cname-target: "cname-here"
        sender-slug: "sendgrid"
        domain-slug: "dmarceverywhere.com"
        sender-owner: "valimail"
        domain-owner: "valimail"

    Netblock:
      type: object
      properties:
        netblock:
          type: string
          description: IP address range in CIDR format
        spf-record:
          type: string
          description: SPF record associated with the netblock
        comment:
          type: string
          description: Comment related to the netblock
        sender-slug:
          type: string
          description: Slug identifier for the sender
        domain-slug:
          type: string
          description: Slug identifier for the domain
      example:
        netblock: "127.0.0.1/32"
        spf-record: "v=spf1 ip4:127.0.0.1 -all"
        comment: "This is a comment"
        sender-slug: "sendgrid"
        domain-slug: "dmarceverywhere.com"

