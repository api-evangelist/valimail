                  created: "2026-03-16T14:13:09.867Z"
                  lastModified: "2026-03-25T13:22:47.26Z"
                  location: "https://api.valimail.com/account/valimail/scim/v2/users/49c398b12b"
        '400':
          description: Bad Request - Invalid PATCH operation
          content:
