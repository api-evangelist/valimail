                type: string
              example: ["example.com", "example.org"]
          - name: policy-mx-host
            in: query
            description: "The MX host value present in the TLS reports."
            required: false
            schema:
              type: string
              example: "mx1.example.com"
          - name: policy-mode
            in: query
            description: "The policy mode value present in the TLS reports."
