openapi: 3.0.0
info:
  title: Configuration API
  description: ValiMail Configuration API
  version: 1.1.0
servers:
  - url: https://api.valimail.com
    description: API services
  - url: https://api.valimail-staging.com
    description: Stage test server
  - url: http://localhost:7001
    description: Local development server


paths:
  /auth:
    post:
      tags:
        - Authentication
      summary: Authenticates the API user with the credentials (client-id and app-id)
      description: When the authentication is successful, the response will include a bearer token and a timestamp of when the token expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyRequest'
            example:
              client-id: "34acfc47-e910-4dcc-bb22-e2816f7e1e4c"
              app-id: "358e2665-dfb9-4a9f-b8db-c0404b7bf087"
      responses:
        '200':
          description: Ok - Authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyResponse'
              example:
                token: "M2I2ZjU1NWUtN2E0Mi00NTkyLWEyNWYtNjIwNGNlNTI3NzVh"
                expires-at: "2029-10-31T18:26:50.597068836Z"
        '400':
          description: Bad Request - Missing Authorization Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultOdinErrorResponse'
              example:
                request: "/accounts/{{the_account_slug}}/domains/{{domainSlug}}/"
                message: "missing Authorization: Bearer header"
                type: ""
                request-id: "CkmvjqpFKrQzajCScVFHTnokjKKiORRF"
                call: "api"
                status: "400"
        '422':
          description: Unprocessable Entity - Failed to normalize or parse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultDelegatedAPIErrorResponse'
              example:
                request: "/accounts/{{the_account_slug}}/domains/{{domainSlug}}/"
                message: "Invalid domain"
                type: "invalid-domain"
                call: "internal"
        '429':
          description: Over Rate - Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultOdinErrorResponse'
              example: null
        '500':
          description: Internal Server Error - Service, database, or unclassified error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultOdinErrorResponse'


  /webhooks/keys:
    get:
      tags:
        - Webhooks
      summary: Returns the public keys used to verify webhook signatures
      description: Returns a map of key IDs to base64-encoded Ed25519 public keys.
      security: []
      responses:
        '200':
          description: Ok - Webhook public keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookPublicKeys'
              example:
                v1: "MCowBQYDK2VwAyEA7qfrsoAMbKGQWiSiGQ0LMmUZ4U9zDE89j9cV5qlrGqE="
        '503':
          description: Service Unavailable - Webhook public keys not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                request: "/webhooks/keys"
                message: "webhook public keys not configured"
                type: "service-unavailable"
                request-id: "XnZlLUJLJvcdFXExvFpPVdLiROhoAMKy"
                call: "api"
        '500':
          description: Internal Server Error - Service, database, or unclassified error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                request: "/webhooks/keys"
                message: "internal server error"
                type: "internal-error"
                request-id: "XnZlLUJLJvcdFXExvFpPVdLiROhoAMKy"
                call: "internal"

  /accounts/{slug}/domains:
    get:
      summary: Returns a list of domains and/or subdomains with relevant data for a given account
      tags:
        - Domains
      parameters:
        - name: slug
          in: path
          description: "Account slug to be queried."
          required: true
          schema:
            type: string
          example: "valimail"
        - name: domain
          in: query
          description: "Filter by List of Domains."
          required: false
          schema:
            type: array
            items:
              type: string
            example:
              - "dmarceverywhere.com"
              - "heytest.com"
        - name: dmarc-record
          description: "Filter by List of DMARC record types."
          in: query
          schema:
            type: array
            items:
              type: string
          example:
            - "None"
            - "NS"
            - "CNAME"
            - "TXT"
        - name: enforcement-status
          description: "Filter by List of Enforcement statuses."
          in: query
          schema:
            type: array
            items:
              type: string
          example:
            - "Not Configured"
            - "Not At Enforcement"
            - "Sending With Enforcement"
            - "Blocked"
        - name: dmarc-policy
          description: "Filter by List of DMARC policies."
          in: query
          schema:
            type: array
            items:
              type: string
          example:
            - "None"
            - "Quarantine"
            - "Reject"
        - name: sending-status
          description: "Filter by List of Sending statuses."
          in: query
          schema:
            type: array
            items:
              type: string
          example:
            - "Active"
            - "Reporting Only"
            - "Blocked"
        - name: org-domain-only
          description: "Filter to return only organizational domains when true."
          in: query
          schema:
            type: boolean
          example: false
        - name: reverse
          description: "Reverse the order of the list to be provided."
          in: query
          schema:
            type: boolean
          example: false
        - name: sort-key
          description: "Sorts the given list by a key. (e.g., domain_name, dmarc_record_type, enforcement_status, dmarc_policy, sending_status, last_report_date)"
          in: query
          schema:
            type: string
          example: "domain_name"
      responses:
        '200':
          description: Ok - List of Domains linked to the account slug are provided
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Domain'
              example:
                - domain: "dmarceverywhere.com"
                  is-org-domain: true
                  dmarc-record: "CNAME"
                  enforcement-status: "Not At Enforcement"
                  dmarc-policy: "Quarantine"
                  sending-status: "Active"
                  account-slug: "valimail"
                  dmarc-pcd: "Quarantine"
                  last-report-date: "2021-01-01"
                - domain: "heytest.com"
                  is-org-domain: true
                  dmarc-record: "TXT"
                  enforcement-status: "Not At Enforcement"
                  dmarc-policy: "None"
                  sending-status: "Active"
                  account-slug: "valimail"
                  last-report-date: "2021-01-01"
        '400':
          description: Bad Request - Missing Authorization Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultOdinErrorResponse'
              example:
                request: "/accounts/{{the_account_slug}}/domains/{{domainSlug}}/"
                message: "missing Authorization: Bearer header"
                type: ""
                request-id: "CkmvjqpFKrQzajCScVFHTnokjKKiORRF"
                call: "api"
                status: "400"
        '401':
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultOdinErrorResponse'
              examples:
                authenticationFailed:
                  value:
                    request: "/accounts/{{the_account_slug}}/domains/{{domainSlug}}/"
                    message: "Unauthorized"
                    type: ""
                    request-id: "CkmvjqpFKrQzajCScVFHTnokjKKiORRF"
                    call: "api"
                    status: "401"
                invalidSlug:
                  value:
                    request: "/accounts/{{the_account_slug}}/domains/{{domainSlug}}/"
                    message: "not authorized for slug valimail"
                    type: ""
                    request-id: "CkmvjqpFKrQzajCScVFHTnokjKKiORRF"
                    call: "api"
                    status: "401"
        '422':
          description: Unprocessable Entity - Failed to normalize or parse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultDelegatedAPIErrorResponse'
              example:
                request: "/accounts/{{the_account_slug}}/domains/{{domainSlug}}/"
                message: "Invalid domain"
                type: "invalid-domain"
                call: "internal"
        '429':
          description: Over Rate - Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultOdinErrorResponse'
              example: null
        '500':
          description: Internal Server Error - Service, database, or unclassified error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultOdinErrorResponse'
    post:
      summary: Creates an domain/subdomain associated with an account
      tags:
        - Domains
      parameters:
        - name: slug
          description: "Account slug to create a domain."
          in: path
          required: true
          schema:
            type: string
          example: "valimail"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainCreate'
            example:
              domain: "dmarceverywhere.com"
      responses:
        '200':
          description: OK - Domain created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
              example:
                domain: "dmarceverywhere.com"
                is-org-domain: true
                dmarc-record-type: "CNAME"
                enforcement-status: "Not At Enforcement"
                dmarc-policy: "Quarantine"
                sending-status: "Active"
                account-slug: "valimail"
                dmarc-record: "v=DMARC1; p=quarantine; rua=mailto:dmarc_agg@vali.email"
                dmarc-pcd: "Quarantine"
        '400':
          description: Bad Request - Missing Authorization Token or invalid payload
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DefaultOdinErrorResponse'
                  - $ref: '#/components/schemas/DelegatedAPIValidationErrorResponse'
              examples:
                missingAuthorizationToken:
                  value:
                    request: "/accounts/{{the_account_slug}}/domains/{{domainSlug}}/"
                    message: "missing Authorization: Bearer header"
                    type: ""
                    request-id: "CkmvjqpFKrQzajCScVFHTnokjKKiORRF"
                    call: "api"
                    status: "400"
                missingDomainParameter:
                  value:
                    params: "{}"
                    details:
                      - field: "domain"
                        value: ""
                        message: "can't be blank"
                blankDomainPayload:
                  value:
                    params: '{"domain":"   "}'
                    details:
                      - field: "domain"
                        value: ""
                        message: "can't be blank"
        '401':
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultOdinErrorResponse'
              examples:
                authenticationFailed:
                  value:
                    request: "/accounts/{{the_account_slug}}/domains/{{domainSlug}}/"
                    message: "Unauthorized"
                    type: ""
                    request-id: "CkmvjqpFKrQzajCScVFHTnokjKKiORRF"
                    call: "api"
                    status: "401"
                invalidSlug:
                  value:
                    request: "/accounts/{{the_account_slug}}/domains/{{domainSlug}}/"
                    message: "not authorized for slug valimail"
                    type: ""
                    request-id: "CkmvjqpFKrQzajCScVFHTnokjKKiORRF"
                    call: "api"
                    status: "401"
        '422':
          description: Unprocessable Entity - Failed to normalize or parse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultDelegatedAPIErrorResponse'
              examples:
                invalidDomain:
                  value:
                    request: "/accounts/{{the_account_slug}}/domains/{{domainSlug}}/"
                    message: "Invalid domain"
                    type: "invalid-domain"
                    call: "internal"
                parentDomainNotAssociated:
                  value:
                    request: "/accounts/{{the_account_slug}}/domains"
                    message: "Parent domain example.org is not associated with this account"
                    type: "invalid-domain"
                    call: "internal"
                domainAlreadyClaimed:
                  value:
                    request: "/accounts/{{the_account_slug}}/domains"
                    message: "This domain is already claimed."
                    type: "invalid-domain"
                    call: "internal"
                invalidOrganizationalDomain:
                  value:
                    request: "/accounts/{{the_account_slug}}/domains"
                    message: "Enter a valid organizational domain name."
                    type: "invalid-domain"
                    call: "internal"
        '429':
          description: Over Rate - Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: null
        '500':
          description: Internal Server Error - Service, database, or unclassified error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

