    patch:
      summary: Updates a user's attributes using SCIM PATCH operation
      description: |
        Partially updates an existing SCIM user (RFC 7644 PatchOp).

        Supported operations:
        - op: "replace" only

        Supported paths:
        - active (boolean: true/false)
        - urn:ietf:params:scim:schemas:extension:valimailuserextension:2.0:User.memberType
          (owner, member, or marketer when enabled for the account)

        Requirements:
        - schemas must include "urn:ietf:params:scim:api:messages:2.0:PatchOp"

        Notes:
        - PUT is not supported for this endpoint.
        - Unsupported op/path/value returns 400.
      tags:
        - SCIM
      parameters:
        - name: slug
          in: path
          description: "Account slug of the user to update."
          required: true
          schema:
            type: string
          example: "valimail"
        - name: id
          in: path
          description: "User ID to update."
          required: true
          schema:
            type: string
          example: "49c398b12b"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimPatchRequest'
            example:
              schemas:
                - "urn:ietf:params:scim:api:messages:2.0:PatchOp"
              Operations:
                - op: "replace"
                  path: "active"
                  value: false
                - op: "replace"
                  path: "urn:ietf:params:scim:schemas:extension:valimailuserextension:2.0:User.memberType"
                  value: "owner"
      responses:
        '200':
          description: Ok - User updated successfully
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
              example:
                schemas:
                  - "urn:ietf:params:scim:schemas:core:2.0:User"
                  - "urn:ietf:params:scim:schemas:extension:valimailuserextension:2.0:User"
                id: "49c398b12b"
                userName: "foo@somedomain.com"
                externalId: "string"
                name:
