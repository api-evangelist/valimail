              schema:
                $ref: '#/components/schemas/ScimError'
              example:
                schemas:
                  - "urn:ietf:params:scim:api:messages:2.0:Error"
                status: "400"
                detail: "Invalid PATCH operation: Unsupported operation type"
        '403':
